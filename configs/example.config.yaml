app:
  name: gotemplate
  version: 0.1.0
  env: dev
  service_code: 12
  message_key_prefix: "gotemplate"

http:
  port: 8080
  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
    allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    allowed_headers: ["Accept", "Authorization", "Content-Type", "X-Request-ID"]
    exposed_headers: ["X-Request-ID"]
    allow_credentials: false
    max_age: 300


grpc:
  port: 9091

auth:
  jwt_secret: "change-me"
  jwt_leeway: 30s
  jwt_issuer: "gotemplate"
  jwt_audience:
    - "gotemplate-api"
  api_keys:
    - "example-api-key"

log:
  level: DEBUG
  mode: console

tracing:
  service_name: gotemplate
  kind: otel
  exporter:
    kind: zipkin
    endpoint: http://localhost:9411/api/v2/spans
  provider:
    sampler_kind: always
    sample_rate: 1.0

metric:
  service_name: gotemplate
  kind: otel
  readers:
    - exporter_kind: otel_prometheus
      interval: 10
    - exporter_kind: otel_grpc
      exporter_endpoint: http://localhost:4317
      interval: 10
